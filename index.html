<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>DOOR — 見えない扉 | mochi × error</title><style>
:root{--ink:#252536;--paper:#fffdf6;--accent:#ffca62}*{box-sizing:border-box}body{margin:0;background:#eae6dc;color:var(--ink);font-family:system-ui,'Hiragino Kaku Gothic ProN',sans-serif;display:flex;justify-content:center}main{width:min(100%,520px);min-height:100dvh;background:var(--paper);padding:14px;box-shadow:0 0 40px #aaa6}header{display:flex;align-items:center;justify-content:space-between;gap:8px}h1{font-size:27px;letter-spacing:4px;margin:0}small{font-size:11px}button{font:inherit;cursor:pointer;border:2px solid var(--ink);border-radius:11px;background:#fff;padding:8px 10px;color:var(--ink);box-shadow:2px 3px 0 #252536}button:active{transform:translate(2px,3px);box-shadow:none}button:disabled{opacity:.45;cursor:default}.sub{font-size:12px;margin:2px 0 12px}.stats{display:flex;gap:7px;flex-wrap:wrap;font-size:12px;margin-bottom:10px}.pill{background:#f6efd9;border:1px solid #ccc3aa;border-radius:20px;padding:5px 9px}#board{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;background:#d8d3c8;padding:6px;border:3px solid var(--ink);border-radius:12px;aspect-ratio:1/1} .cell{border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:clamp(17px,5vw,27px);background:#fffefa;position:relative;min-width:0}.wall{background:repeating-linear-gradient(35deg,#9d9aa2,#9d9aa2 5px,#b9b5bd 5px,#b9b5bd 10px)}.player{background:#ffe4a6;border:2px dashed #c08025;border-radius:50%}.exit{background:#d8f5df}.door{background:#f6e3cf}.hint{font-size:12px;min-height:50px;margin:10px 0;background:#fff5d8;border-radius:8px;padding:9px}.controls{display:grid;grid-template-columns:repeat(3,55px);gap:6px;justify-content:center;margin:8px 0}.controls button{height:43px}.controls .up{grid-column:2}.controls .left{grid-column:1}.controls .down{grid-column:2}.controls .right{grid-column:3}.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:12px 0}.actions button{font-size:13px}.collection{border-top:2px dashed #bbb;padding-top:8px}.collection h2{font-size:17px;margin:8px 0}.collectionGrid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}.badge{aspect-ratio:1;display:grid;place-items:center;background:#eee;border:1px solid #bbb;border-radius:5px;font-size:19px;filter:grayscale(1);opacity:.45}.badge.got{filter:none;opacity:1;background:#fff2d0}.overlay{position:fixed;inset:0;background:#181822a8;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.overlay.show{display:flex}.modal{background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:20px;width:min(100%,390px);text-align:center}.modal h2{margin-top:0}.modal p{line-height:1.8}.modal .big{font-size:64px;margin:5px}.modal button{margin:5px}.footer{font-size:11px;text-align:center;opacity:.7;margin:20px 0}.flash{animation:flash .3s alternate 4}@keyframes flash{to{filter:hue-rotate(120deg);transform:rotate(.4deg)}}

body.beat #board{box-shadow:0 0 0 5px #ffca6299,0 0 28px #ffc95b;transform:scale(1.008)}
body.chorus #board{background:#ffbd58;animation:doorPulse .36s ease-in-out infinite alternate}
body.chorus .wall{background:repeating-linear-gradient(45deg,#7d7b98,#7d7b98 6px,#e7a9d2 6px,#e7a9d2 12px)}
@keyframes doorPulse{to{filter:hue-rotate(28deg);transform:scale(.992)}}

</style></head><body><main><header><div><h1>🚪 DOOR</h1><div class="sub">見えない扉 — mochi / ALMOST HUMAN</div></div><button id="musicBtn">♫ BGM</button></header><div class="stats"><span class="pill" id="levelStat">部屋 1</span><span class="pill" id="countStat">ドア 0 / 100</span><span class="pill" id="keyStat">鍵 0</span></div><div id="board" aria-label="迷路"></div><div class="hint" id="message">迷路を進み、扉を見つけよう。</div><div class="controls"><button class="up" data-move="0,-1">▲</button><button class="left" data-move="-1,0">◀</button><button class="down" data-move="0,1">▼</button><button class="right" data-move="1,0">▶</button></div><div class="actions"><button id="peek">🔑 鍵穴を覗く</button><button id="knock">✊ ノック</button><button id="back">↩ 引き返す</button><button id="reset">最初から</button></div><section class="collection"><h2>🚪 ドア図鑑 <small>（100種類）</small></h2><div class="collectionGrid" id="collection"></div></section><p class="footer">矢印キー・WASD・画面ボタンで移動｜進行状況は自動保存<br>楽曲「ドア」はBGMボタンから読み込めます。</p><input id="audioFile" type="file" accept="audio/*" hidden><audio id="audio" preload="metadata" loop></audio></main><div class="overlay" id="overlay"><div class="modal"><h2 id="modalTitle"></h2><div class="big" id="modalIcon"></div><p id="modalText"></p><div id="modalButtons"></div></div></div><script>
const $=id=>document.getElementById(id),N=7,icons=['🚪','🚪','🚪','🚪','🚪','🚪','🚪','🚪','🚪','🚪'];const colors=['#e8a27d','#9bc4e2','#c1b2df','#a5d8b0','#ffdc87','#f3b5c7','#a8d9d2','#d7ba91','#c5c5cb','#e7c4a1'];
let state;try{state=JSON.parse(localStorage.getItem('mochi-door-save-v1'))}catch{};if(!state||!Array.isArray(state.found))state={room:1,found:[],keys:0,steps:0};let grid=[],pos={x:1,y:1},previous=null,doorAt=null,doorType=0,visited=new Set(),knocks=0,beat=0;
function save(){localStorage.setItem('mochi-door-save-v1',JSON.stringify(state))}function rand(seed){let x=Math.sin(seed*9283.22+78.23)*43758.5453;return x-Math.floor(x)}function message(s){$('message').textContent=s}function show(title,icon,txt,buttons){$('modalTitle').textContent=title;$('modalIcon').textContent=icon;$('modalText').textContent=txt;let el=$('modalButtons');el.innerHTML='';buttons.forEach(([label,fn])=>{let b=document.createElement('button');b.textContent=label;b.onclick=()=>{hide();fn()};el.append(b)});$('overlay').classList.add('show')}function hide(){$('overlay').classList.remove('show')}
function makeRoom(){let room=state.room;grid=Array.from({length:N},(_,y)=>Array.from({length:N},(_,x)=>x===0||y===0||x===N-1||y===N-1?'#':'.'));pos={x:1,y:1};visited=new Set(['1,1']);knocks=0;doorType=(room-1)%4;let seed=room*47;for(let i=0;i<8;i++){let x=1+Math.floor(rand(seed+i*5)*5),y=1+Math.floor(rand(seed+i*7+2)*5);if((x===1&&y===1)||(x===5&&y===5))continue;grid[y][x]='#'}// guarantee route with pathfinding: carve a simple corridor
for(let x=1;x<=5;x++)grid[1][x]='.';for(let y=1;y<=5;y++)grid[y][5]='.';doorAt={x:5,y:5};grid[5][5]='D';let keyX=2+Math.floor(rand(seed+10)*3),keyY=2+Math.floor(rand(seed+11)*3);if(grid[keyY][keyX]==='.'&&!(keyX===5&&keyY===5))grid[keyY][keyX]='K';render();message(['開いたドアの向こうは見えない。近づいてみよう。','鍵のかかったドア。鍵穴の向こうに光が見える。','このドアはノックに反応するらしい。','迷路の壁が変わる。「はらはら」の部屋。'][doorType])}
function render(){let b=$('board');b.innerHTML='';grid.forEach((row,y)=>row.forEach((v,x)=>{let d=document.createElement('div');d.className='cell '+(v==='#'?'wall':v==='D'?'door':v==='E'?'exit':'');if(x===pos.x&&y===pos.y){d.className='cell player';d.textContent='🤖'}else if(v==='D'){d.textContent=['🚪','🔒','🚪','🚪'][doorType]}else if(v==='K')d.textContent='🗝️';else if(v==='E')d.textContent='✨';b.append(d)}));$('levelStat').textContent='部屋 '+state.room;$('countStat').textContent='ドア '+state.found.length+' / 100';$('keyStat').textContent='鍵 '+state.keys;let c=$('collection');c.innerHTML='';for(let i=1;i<=100;i++){let d=document.createElement('div');d.className='badge'+(state.found.includes(i)?' got':'');d.title=state.found.includes(i)?'ドア '+i+' 発見':'???';d.textContent=state.found.includes(i)?['🚪','🟧','🟦','🟪','🟩','🟨','🟥','🟫','🚪','🚪'][i%10]:'?';if(state.found.includes(i))d.style.background=colors[i%10];c.append(d)}}
function move(dx,dy){let x=pos.x+dx,y=pos.y+dy;if(x<0||y<0||x>=N||y>=N||grid[y][x]==='#'){message('壁がある。別の道を探そう。');return}if(grid[y][x]==='K'){state.keys++;grid[y][x]='.';message('🗝️ 鍵を拾った！');save()}if(grid[y][x]==='D'){approach();return}previous={...pos};pos={x,y};state.steps++;visited.add(x+','+y);if(doorType===3&&state.steps%7===0){$('board').classList.add('flash');setTimeout(()=>$('board').classList.remove('flash'),650);message('はらはらはら…迷路が揺れた！')}render()}
function approach(){if(doorType===1&&state.keys<1){message('🔒 開かないドア。鍵穴を覗くと光が見える。鍵を探そう。');return}if(doorType===2&&knocks<3){message('ドアは開かない。3回ノックしてみよう。');return}let id=state.room;if(!state.found.includes(id)){state.found.push(id);state.found.sort((a,b)=>a-b)}if(doorType===1)state.keys--;save();let text=['扉の向こうは見えない。でも、一歩踏み出した。','開かない扉の先に、見えていた光。','一歩一歩ドア叩く。カラクリがほどけた。','予測、推測、速アクセル！迷路を抜けた。'][doorType];if(id===100){show('100の扉を越えて','✨','見えない扉を開ければ、光の手を見付ける。100種類のドアをすべて発見！',[['もう一度旅する',()=>{state.room=1;save();makeRoom()}]])}else show('ドア '+id+' 発見！','🚪',text,[['次の部屋へ',()=>{state.room++;save();makeRoom()}],['図鑑を見る',()=>{state.room++;save();makeRoom();document.querySelector('.collection').scrollIntoView({behavior:'smooth'})}]])}
function nearDoor(){return Math.abs(pos.x-doorAt.x)+Math.abs(pos.y-doorAt.y)<=1}
$('peek').onclick=()=>{if(!nearDoor()){message('鍵穴を覗くには、ドアの隣まで進もう。');return}show('鍵穴の向こう','👁️',doorType===1?'いつもの風景なのに、違う光が見える。鍵を手に入れれば開きそうだ。':'向こう側に、小さな光の手が見えた。',[['戻る',()=>{}]])};$('knock').onclick=()=>{if(!nearDoor()){message('ノックするにはドアの隣まで進もう。');return}knocks++;message('コン、コン… '+knocks+'回目のノック。'+(doorType===2&&knocks>=3?'ドアが開く音がした！':''));if(knocks>=3&&doorType===2)grid[doorAt.y][doorAt.x]='D'};$('back').onclick=()=>{if(previous){let p={...pos};pos=previous;previous=p;render();message('引き返すことも、前に進むための一歩。')}else message('まだ引き返す道はない。')};$('reset').onclick=()=>show('最初からやり直す？','↩️','図鑑の収集記録も消えます。',[['取り消す',()=>{}],['リセットする',()=>{state={room:1,found:[],keys:0,steps:0};save();makeRoom()}]]);document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{let [x,y]=b.dataset.move.split(',').map(Number);move(x,y)});window.addEventListener('keydown',e=>{let m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};if(m[e.key]){e.preventDefault();move(...m[e.key])}});let startX,startY;$('board').addEventListener('touchstart',e=>{startX=e.touches[0].clientX;startY=e.touches[0].clientY},{passive:true});$('board').addEventListener('touchend',e=>{if(startX==null)return;let dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;if(Math.max(Math.abs(dx),Math.abs(dy))>25)move(Math.abs(dx)>Math.abs(dy)?Math.sign(dx):0,Math.abs(dy)>Math.abs(dx)?Math.sign(dy):0);startX=null},{passive:true});$('musicBtn').onclick=()=>{if($('audio').src){if($('audio').paused){$('audio').play().catch(()=>{});$('musicBtn').textContent='♫ 停止'}else{$('audio').pause();$('musicBtn').textContent='♫ 再生'}}else $('audioFile').click()};$('audioFile').onchange=e=>{let f=e.target.files[0];if(f){$('audio').src=URL.createObjectURL(f);$('audio').play().then(()=>$('musicBtn').textContent='♫ 停止').catch(()=>{});message('🎵 '+f.name+' をBGMに設定しました。')}};
// 音源は同じフォルダに配置。ブラウザの自動再生制限により、最初はボタン操作で再生します。
const bgm=$('audio');
bgm.src='error - ドア.mp3';
bgm.loop=true;
const status=document.createElement('div');status.id='musicStatus';
status.textContent='🎵 mochi作曲「ドア」／error — ♫ 再生で音楽連動スタート';
$('board').insertAdjacentElement('beforebegin',status);
let ctx, analyser, data, source, prevEnergy=0, lastFlash=0;
function setupAudio(){
 if(ctx)return;
 try{ctx=new (window.AudioContext||window.webkitAudioContext)();analyser=ctx.createAnalyser();analyser.fftSize=512;data=new Uint8Array(analyser.frequencyBinCount);source=ctx.createMediaElementSource(bgm);source.connect(analyser);analyser.connect(ctx.destination)}catch(e){console.warn('Audio visualizer unavailable',e)}
}
function toggleMusic(){
 if(bgm.paused){setupAudio();if(ctx?.state==='suspended')ctx.resume();bgm.play().then(()=>{$('musicBtn').textContent='♫ 停止'}).catch(()=>{status.textContent='音楽を再生できません。ZIP内のMP3とHTMLを同じ場所に置いてください。'})}
 else{bgm.pause();$('musicBtn').textContent='♫ 再生'}
}
$('musicBtn').onclick=toggleMusic;
$('audioFile').onchange=e=>{let f=e.target.files[0];if(f){bgm.pause();bgm.src=URL.createObjectURL(f);toggleMusic();message('🎵 '+f.name+' をBGMに設定しました。')}};
// 楽曲のサビ付近を目安に演出。さらに実際の音量の変化で光と迷路が反応します。
const chorusRanges=[[47,76],[101,121],[137,155]];
function animateMusic(t){
 let playing=!bgm.paused&&bgm.readyState>=2;
 let chorus=playing&&chorusRanges.some(([a,b])=>bgm.currentTime>=a&&bgm.currentTime<=b);
 document.body.classList.toggle('chorus',chorus);
 let energy=0;
 if(playing&&analyser){analyser.getByteFrequencyData(data);for(let i=2;i<85;i++)energy+=data[i];energy/=83*255}
 if(playing&&energy>0.36&&energy>prevEnergy*1.13&&t-lastFlash>150){lastFlash=t;document.body.classList.add('beat');setTimeout(()=>document.body.classList.remove('beat'),115)}
 prevEnergy=energy*.65+prevEnergy*.35;
 if(playing)status.textContent='🎵 ドア 再生中 '+Math.floor(bgm.currentTime/60)+':'+String(Math.floor(bgm.currentTime%60)).padStart(2,'0')+(chorus?' ｜ はらはら迷路 ✨':' ｜ 扉が音に反応中');
 else status.textContent='🎵 mochi作曲「ドア」／error — ♫ 再生で音楽連動スタート';
 requestAnimationFrame(animateMusic)
}
requestAnimationFrame(animateMusic);
makeRoom();
</script></body></html>
