<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DOOR — 光の向こう | mochi × error</title><style>
*{box-sizing:border-box}body{margin:0;background:#140d1d;color:#fff;font-family:system-ui,'Hiragino Kaku Gothic ProN',sans-serif;overflow:hidden}#game{position:fixed;inset:0}canvas{display:block}#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}#hud>div{background:#160e23b9;border:1px solid #ffffff42;border-radius:13px;padding:10px 13px;backdrop-filter:blur(9px)}h1{font-size:20px;letter-spacing:3px;margin:0}.small{font-size:11px;color:#e4cde7}#info{font-size:12px;text-align:right;line-height:1.7}#message{position:fixed;top:23%;left:50%;transform:translateX(-50%);width:min(90%,450px);text-align:center;pointer-events:none;text-shadow:0 2px 10px #130d1c;font-size:16px;font-weight:700;opacity:0;transition:opacity .3s}#message.show{opacity:1}#controls{position:fixed;bottom:20px;left:15px;display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,56px);gap:5px;touch-action:none}button{background:#261a37bd;color:white;border:1px solid #ffffff75;border-radius:15px;font-size:21px;backdrop-filter:blur(7px);touch-action:none;user-select:none}button:active,.pressed{background:#a65580c9}#up{grid-column:2}#left{grid-column:1;grid-row:2}#down{grid-column:2;grid-row:2}#right{grid-column:3;grid-row:2}#actions{position:fixed;bottom:23px;right:15px;display:flex;flex-direction:column;gap:8px}#actions button{font-size:13px;padding:12px;min-width:112px}#start{position:fixed;inset:0;background:linear-gradient(#130a22ad,#180d26e8);display:grid;place-items:center;z-index:5;padding:25px}#start article{text-align:center;max-width:370px}#start h2{font-size:40px;letter-spacing:8px;margin:10px 0}#start p{line-height:1.8;color:#f3d9ea}#start button{background:#f3c6a7;color:#28162b;font-weight:bold;padding:14px 40px;font-size:17px}#start .note{font-size:12px;color:#c9b9ca}#error{position:fixed;inset:0;background:#1a1023;display:none;place-items:center;padding:20px;text-align:center;z-index:10}#flash{position:fixed;inset:0;background:#ffe6e8;pointer-events:none;opacity:0;transition:opacity .5s}@media(min-width:800px){#controls{bottom:30px;left:35px}#actions{bottom:30px;right:35px}}@media(max-width:360px){#controls{grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,48px)}#actions button{min-width:90px;padding:10px}}
</style></head><body><div id="game"></div><div id="flash"></div><div id="hud"><div><h1>🚪 DOOR</h1><div class="small">見えない扉 — mochi × error</div></div><div id="info">世界 <span id="world">1</span> / 100<br>発見した扉 <span id="count">0</span> / 100<br><span id="distance">光の扉を探そう</span></div></div><div id="message" role="status"></div><div id="controls"><button id="up" aria-label="前へ">▲</button><button id="left" aria-label="左へ">◀</button><button id="down" aria-label="後ろへ">▼</button><button id="right" aria-label="右へ">▶</button></div><div id="actions"><button id="open">🚪 扉を開ける</button><button id="music">♫ BGM ON</button><button id="reset">↺ 最初から</button></div><div id="start"><article><div style="font-size:65px">🚪</div><h2>DOOR</h2><p>開いているドアの先は、見えない。<br>迷いながら、光の扉を探す。<br><strong>100の世界を越える旅。</strong></p><button id="play">旅を始める ♪</button><p class="note">方向ボタン / WASD / 矢印キーで移動<br>扉に近づいたら「扉を開ける」<br>※通信環境が必要です（3D描画ライブラリを使用）</p></article></div><div id="error">3D表示を読み込めませんでした。インターネット接続を確認してページを再読み込みしてください。</div><audio id="audio" src="error - ドア.mp3" preload="auto" loop></audio><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const $=id=>document.getElementById(id);let saved={world:1,found:[]};try{let s=JSON.parse(localStorage.getItem('door-3d-v1'));if(s&&Array.isArray(s.found))saved=s}catch{};let world=Math.min(100,Math.max(1,saved.world||1));const found=new Set(saved.found);const audio=$('audio');let started=false,musicWanted=true,clock=new THREE.Clock(),tick=0,noticeTimer;const scene=new THREE.Scene();scene.background=new THREE.Color(0x341c32);scene.fog=new THREE.FogExp2(0x44243c,.018);const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,180);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.3;$('game').appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffb5b3,0x291326,1.7));const sun=new THREE.DirectionalLight(0xff9b85,2);sun.position.set(-8,14,4);scene.add(sun);const pink=new THREE.PointLight(0xff8f97,65,50);pink.position.set(0,8,-16);scene.add(pink);const mat=(c,roughness=1)=>new THREE.MeshStandardMaterial({color:c,roughness,metalness:.05});const groundMat=mat(0x3a243b),wallMat=mat(0x6a3d4e),darkMat=mat(0x211c2c);const worldObjects=[];function add(o){scene.add(o);worldObjects.push(o);return o}function box(w,h,d,m,x,y,z){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=false;return add(o)}function rand(n){let v=Math.sin(n*127.1+world*311.7)*43758.5453;return v-Math.floor(v)}
const player=new THREE.Group();scene.add(player);const body= new THREE.Mesh(new THREE.CapsuleGeometry(.42,1.1,5,10),mat(0x242132));body.position.y=1.15;player.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.4,16,12),mat(0x28212f));head.position.y=2.15;player.add(head);const hair=new THREE.Mesh(new THREE.SphereGeometry(.43,16,10),mat(0x181521));hair.position.set(0,2.34,-.05);hair.scale.set(1,0.68,1);player.add(hair);for(let s of [-1,1]){let arm=new THREE.Mesh(new THREE.CapsuleGeometry(.12,.72,4,8),mat(0x25202e));arm.position.set(s*.58,1.35,0);arm.rotation.z=s*.16;player.add(arm)}const door=new THREE.Group();scene.add(door);const frameMat=new THREE.MeshStandardMaterial({color:0xffd3b5,emissive:0xff826c,emissiveIntensity:1.7});const portalMat=new THREE.MeshBasicMaterial({color:0xfff9e7,side:THREE.DoubleSide});const portal=new THREE.Mesh(new THREE.PlaneGeometry(3.25,5.6),portalMat);portal.position.y=3;door.add(portal);for(let [x,y,w,h] of [[-1.85,3,.32,6.3],[1.85,3,.32,6.3],[0,6,4,.35]]){let f=new THREE.Mesh(new THREE.BoxGeometry(w,h,.4),frameMat);f.position.set(x,y,0);door.add(f)}const light=new THREE.PointLight(0xffd8b2,80,27);light.position.set(0,3,1);door.add(light);const particles=[];for(let i=0;i<80;i++){let p=new THREE.Mesh(new THREE.SphereGeometry(.035+rand(i)*.045,5,5),new THREE.MeshBasicMaterial({color:i%3?0xffb8a3:0xffffff,transparent:true,opacity:.4+rand(i+40)*.5}));add(p);particles.push(p)}
function rebuild(){worldObjects.forEach(o=>scene.remove(o));worldObjects.length=0;let hue=(world*19)%360;scene.background.setHSL(hue/360,.27,.18);scene.fog.color.copy(scene.background);groundMat.color.setHSL(hue/360,.2,.19);wallMat.color.setHSL(hue/360,.27,.29);box(100,.4,100,groundMat,0,-.25,0);for(let i=0;i<34;i++){let x=(rand(i+30)-.5)*65,z=(rand(i+90)-.5)*66;if(Math.abs(x)<5&&z<8&&z>-25)continue;let h=2+rand(i+110)*12;let b=box(1+rand(i+120)*2,h,1+rand(i+140)*2,wallMat,x,h/2,z);b.rotation.y=rand(i+170)*Math.PI}for(let i=0;i<22;i++){let x=(rand(i+230)-.5)*50,z=(rand(i+280)-.5)*50,y=5+rand(i+300)*15;let b=box(.5+rand(i+340)*2,.15+rand(i+360)*.5,.7+rand(i+380)*2,darkMat,x,y,z);b.rotation.set(rand(i+390)*2,rand(i+400)*3,rand(i+410)*2)}door.position.set((world%3-1)*4,0,-18);player.position.set(0,0,10);player.rotation.y=0;$('world').textContent=world;$('count').textContent=found.size;msg('光の扉を探そう。近づくと開けられます。');}
function msg(t){$('message').textContent=t;$('message').classList.add('show');clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>$('message').classList.remove('show'),3300)}function save(){localStorage.setItem('door-3d-v1',JSON.stringify({world,found:[...found]}))}const keys=new Set();const moves={up:'up',down:'down',left:'left',right:'right'};for(const id of Object.keys(moves)){let b=$(id);const stop=e=>{keys.delete(id);b.classList.remove('pressed');if(e)b.releasePointerCapture?.(e.pointerId)};b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(id);b.classList.add('pressed');startAudio()});b.addEventListener('pointerup',stop);b.addEventListener('pointercancel',stop);b.addEventListener('lostpointercapture',()=>{keys.delete(id);b.classList.remove('pressed')})}const mapping={ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right'};window.addEventListener('keydown',e=>{if(mapping[e.key]){e.preventDefault();keys.add(mapping[e.key]);if(started)startAudio()}else if(e.key===' '||e.key==='Enter'){e.preventDefault();if(started)openDoor()}});window.addEventListener('keyup',e=>{if(mapping[e.key])keys.delete(mapping[e.key])});window.addEventListener('blur',()=>keys.clear());
function startAudio(){if(!started||!musicWanted||!audio.paused)return;audio.play().catch(()=>{msg('BGMを再生できません。MP3のファイル名を確認してください。')})}function openDoor(){if(!started)return;let dist=player.position.distanceTo(new THREE.Vector3(door.position.x,0,door.position.z));if(dist>5){msg('まだ扉が遠い。もっと近づこう。');return}found.add(world);save();$('count').textContent=found.size;$('flash').style.opacity='.9';setTimeout(()=>$('flash').style.opacity='0',250);if(world===100){msg('100の扉を越えた。光の手を見付けた！');world=1}else{msg('扉 '+world+' 発見！ 次の世界へ…');world++}save();setTimeout(rebuild,350)}$('open').onclick=openDoor;$('play').onclick=()=>{started=true;$('start').style.display='none';startAudio();msg('扉を目指して歩こう。')};$('music').onclick=()=>{musicWanted=!musicWanted;if(musicWanted){$('music').textContent='♫ BGM ON';startAudio()}else{audio.pause();$('music').textContent='♫ BGM OFF'}};$('reset').onclick=()=>{if(confirm('進行状況と扉の発見記録をリセットしますか？')){world=1;found.clear();save();rebuild()}};function animate(){requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.05);tick+=dt;if(started){let vx=(keys.has('right')?1:0)-(keys.has('left')?1:0),vz=(keys.has('down')?1:0)-(keys.has('up')?1:0);let len=Math.hypot(vx,vz);if(len){vx/=len;vz/=len;player.position.x=THREE.MathUtils.clamp(player.position.x+vx*dt*7,-35,35);player.position.z=THREE.MathUtils.clamp(player.position.z+vz*dt*7,-35,35);player.rotation.y=Math.atan2(-vx,-vz);body.position.y=1.15+Math.sin(tick*12)*.06}let dist=Math.hypot(player.position.x-door.position.x,player.position.z-door.position.z);$('distance').textContent=dist<5?'✨ 扉を開けられます':'扉まで '+Math.round(dist)+' m';camera.position.lerp(new THREE.Vector3(player.position.x,player.position.y+4.1,player.position.z+8.7),Math.min(1,dt*3));camera.lookAt(player.position.x,1.9,player.position.z-6)}else{camera.position.set(0,4.1,19);camera.lookAt(0,2,-12)}light.intensity=65+Math.sin(tick*3)*15;portal.material.color.setHSL(.1,.2,.92+Math.sin(tick*3)*.06);particles.forEach((p,i)=>{p.position.set(Math.sin(i*8.7)*12,1+rand(i+700)*13+Math.sin(tick*.6+i)*.6,-18+Math.cos(i*4.2)*11)});renderer.render(scene,camera)}window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});rebuild();animate();
</script></body></html>
